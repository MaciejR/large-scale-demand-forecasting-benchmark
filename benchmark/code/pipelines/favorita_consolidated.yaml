      --hardware E4DS_V4
      --train-fraction 0.8 --train-window-days 365
      --sales-path ${{inputs.sales_data}}
      --oil-path ${{inputs.oil_data}}
      --holidays-path ${{inputs.holidays_data}}
      --stores-path ${{inputs.stores_data}}
      --transactions-path ${{inputs.transactions_data}}
    inputs:
