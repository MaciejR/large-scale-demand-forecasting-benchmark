$schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json
type: pipeline

experiment_name: demand-forecast-benchmark
display_name: M5 Benchmark Phase 1

settings:
  default_compute: azureml:cc-forecast-batch

inputs:
  sales_data:
    type: uri_file
    path: azureml:m5-sales:1
  calendar_data:
    type: uri_file
    path: azureml:m5-calendar:1

jobs:
  naive_h7:
    type: command
    code: ../
    command: >
      python experiments/run_model.py
      --model naive --horizon 7
      --min-train-size 100
      --sales-path ${{inputs.sales_data}}
      --calendar-path ${{inputs.calendar_data}}
    inputs:
      sales_data: ${{parent.inputs.sales_data}}
      calendar_data: ${{parent.inputs.calendar_data}}
    environment: azureml:forecast-benchmark-env:1

  ets_h7:
    type: command
    code: ../
    command: >
      python experiments/run_model.py
      --model ets --horizon 7
      --min-train-size 100
      --sales-path ${{inputs.sales_data}}
      --calendar-path ${{inputs.calendar_data}}
    inputs:
      sales_data: ${{parent.inputs.sales_data}}
      calendar_data: ${{parent.inputs.calendar_data}}
    environment: azureml:forecast-benchmark-env:1

  lightgbm_h7:
