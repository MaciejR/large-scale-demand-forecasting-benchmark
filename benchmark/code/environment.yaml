name: forecast-benchmark
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - pandas>=2.0
      - numpy>=1.24
      - statsmodels>=0.14
      - lightgbm>=4.0
      - scikit-learn>=1.3
      - mlflow>=2.10
      - azureml-mlflow>=1.56
      - matplotlib>=3.8
      - pytest>=7.0
      # Foundation models (GPU compute only)
      - "chronos-forecasting[extras]>=2.2"
      - uni2ts>=2.0
      - einops
      - torch>=2.0
      # Dataset loaders
      - salesforce-gift-eval
      - fev>=0.7
      - python-dotenv
      - datasets
      - gluonts
